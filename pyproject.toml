[project]
name = "respeaker-led-v3-workspace"
version = "3.0.0"
description = "Workspace root for the LEFX V3 effect system and the reSpeaker LED controller"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lefx-sdk",
    "lefx-engine",
    "lefx-authoring",
    "lefx-interfaces",
    "respeaker-led-device",
    "respeaker-led-simulator",
]

# The root is a workspace container, not a distributable. Nothing here is ever
# published; every shippable artifact lives under packages/.
[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

# Workspace members resolve to each other from the checkout rather than from an
# index. This is what makes the dependency direction in the architecture test
# and the direction declared in each package's pyproject the same thing.
[tool.uv.sources]
lefx-sdk = { workspace = true }
lefx-engine = { workspace = true }
lefx-authoring = { workspace = true }
lefx-interfaces = { workspace = true }
respeaker-led-device = { workspace = true }
respeaker-led-simulator = { workspace = true }

[dependency-groups]
dev = [
    "httpx>=0.28.1,<0.29",
    "pytest>=8.4.0,<9",
]

# Only for scripts/build_simulator.py, and deliberately not in dev: PyInstaller
# and Qt together are a large download that everyone would otherwise pay for on
# every sync, to build something most syncs never build.
#     uv sync --group build
build = [
    "pyinstaller>=6.0,<7",
    "PySide6>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
cache_dir = "tests/.cache/pytest_cache"
# Keep scratch files inside the checkout. The system temp directory is not
# reliably reachable on every machine this runs on, and a test run should not
# depend on that.
addopts = "--basetemp=tests/.cache/tmp"
# Some things only a real device can answer: whether the firmware accepts
# LED_RING_COLOR, whether DOA_VALUE comes back in the declared shape, whether a
# pulled cable surfaces as available=False. Those tests exist and are skipped
# where there is nothing to ask.
markers = ["hardware: needs a connected reSpeaker; skipped without one"]

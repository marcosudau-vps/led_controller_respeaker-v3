# Runs in the RELEASE repository, marcosudau-vps/led-ctrl-v3.
#
# It is not under .github/workflows/ in the development repository, so it never
# runs there; scripts/sync_release_tree.py puts it in place when it materialises
# the release tree. It lives in the development repository so that it is
# reviewed alongside the code it publishes.
#
# A tag in the release repository is set by the sync workflow and by nothing
# else, which is what makes "tagged here" mean "checked over there".
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_PYTHON: "3.12"

jobs:
  build:
    name: Build every distribution
    runs-on: ubuntu-latest
    # Belt and braces. A fork of this repository that inherited the workflow
    # would otherwise try to publish to the real project names on the real
    # index, and the failure would be a confusing 403 rather than a skip.
    if: github.repository == 'marcosudau-vps/led-ctrl-v3'
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Read the version out of the tree
        id: version
        run: |
          version=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release tree is at $version"

      - name: The tag has to name the version in the tree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          if [ "$tag" != "${{ steps.version.outputs.version }}" ]; then
            echo "tag v$tag does not match tree version ${{ steps.version.outputs.version }}" >&2
            exit 1
          fi

      - name: Build
        run: uv build --all-packages --out-dir dist

      # Build what will be published, then install it and use it. That step
      # opens every catalogue wheel and looks for the archive inside, which
      # is the question this tree most needs asked: it arrived by machine,
      # and a catalogue wheel with no catalogue in it installs perfectly.
      #
      # Deliberately not repeated inline here. It was, with its own list of
      # catalogue names, and that list is what went stale when the
      # distributions were renamed — the release stopped at a guard looking
      # for a package that no longer existed. One implementation, derived
      # from the tree rather than written down twice.
      - name: Install what was built and use it
        run: uv run --no-project python scripts/check_release.py

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: ${{ matrix.distribution }} to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The secret lives on this environment rather than on the repository, so
    # only a job that names the environment can read it.
    environment: pypi
    # One job per project. That shape is here for trusted publishing, where a
    # single upload of all nine would depend on how PyPI scopes a minted token
    # across projects; with an API token it costs nothing and keeps a failure
    # named after the project it belongs to.
    strategy:
      fail-fast: false
      # One at a time. Nine uploads at once is nine new projects at once the
      # first time a generation is released, and PyPI answers most of them with
      # "429 Too many new projects created" — it did, and four went up while
      # five did not. Serialised they are far enough apart to get through, and
      # a release takes a few minutes longer, which is not a cost.
      max-parallel: 1
      matrix:
        # Wheel-filename form, so the glob below is exact. A wheel is named
        # {name}-{version}-..., so led_ctrl_v3-*.whl matches the metapackage
        # alone and never led_ctrl_v3_sdk-*.whl.
        distribution:
          - led_ctrl_v3
          - led_ctrl_v3_sdk
          - led_ctrl_v3_engine
          - led_ctrl_v3_interfaces
          - led_ctrl_v3_effect_creation
          - led_ctrl_v3_device_respeaker
          - led_ctrl_v3_device_simulated_respeaker
          - led_ctrl_v3_set_core
          - led_ctrl_v3_set_smartspeaker
    # Uploading with an API token, because trusted publishing needs a publisher
    # registered per project through the PyPI web interface — there is no API
    # for it — and a project that does not exist yet cannot have one. An
    # account-scoped token is therefore also the only thing that can create
    # these nine projects in the first place.
    #
    # It is meant to be temporary. Once the projects exist, register the nine
    # publishers (owner marcosudau-vps, repo led-ctrl-v3, workflow release.yml,
    # environment pypi), then switch back by deleting the `password:` line
    # below, restoring `permissions: id-token: write` here, and revoking the
    # token together with the PYPI_API_TOKEN secret on the pypi environment.
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Keep only this project's files
        run: |
          mkdir -p upload
          mv dist/${{ matrix.distribution }}-*.whl upload/
          mv dist/${{ matrix.distribution }}-*.tar.gz upload/
          ls -l upload

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload/
          password: ${{ secrets.PYPI_API_TOKEN }}
          # Attestations need trusted publishing, and an explicit password
          # turns that off. Saying so beats a warning per job about an input
          # that is being ignored. Remove this line together with `password`.
          attestations: false

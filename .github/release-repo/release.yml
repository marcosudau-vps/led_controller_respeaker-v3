# Runs in the RELEASE repository, marcosudau-vps/led-ctrl-v3.
#
# It is not under .github/workflows/ in the development repository, so it never
# runs there; scripts/sync_release_tree.py puts it in place when it materialises
# the release tree. It lives in the development repository so that it is
# reviewed alongside the code it publishes.
#
# A tag in the release repository is set by the sync workflow and by nothing
# else, which is what makes "tagged here" mean "checked over there".
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_PYTHON: "3.12"

jobs:
  build:
    name: Build every distribution
    runs-on: ubuntu-latest
    # Belt and braces. A fork of this repository that inherited the workflow
    # would otherwise try to publish to the real project names on the real
    # index, and the failure would be a confusing 403 rather than a skip.
    if: github.repository == 'marcosudau-vps/led-ctrl-v3'
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Read the version out of the tree
        id: version
        run: |
          version=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release tree is at $version"

      - name: The tag has to name the version in the tree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          if [ "$tag" != "${{ steps.version.outputs.version }}" ]; then
            echo "tag v$tag does not match tree version ${{ steps.version.outputs.version }}" >&2
            exit 1
          fi

      - name: Build
        run: uv build --all-packages --out-dir dist

      # The same question scripts/check_release.py asks, asked again here
      # because this is the tree that is actually published and it arrived by
      # machine. A catalogue wheel with no catalogue in it installs perfectly.
      - name: The catalogue wheels have to contain a catalogue
        run: |
          uv run --no-project python - <<'PY'
          import sys, zipfile
          from pathlib import Path

          expected = {
              "lefxset_core_set": "lefx/sets/core_set/core-set.lefxset",
              "lefxset_smartspeaker_set": "lefx/sets/smartspeaker_set/smartspeaker-set.lefxset",
          }
          problems = []
          for prefix, member in expected.items():
              wheels = sorted(Path("dist").glob(f"{prefix}-*.whl"))
              if len(wheels) != 1:
                  problems.append(f"{prefix}: {len(wheels)} wheels")
                  continue
              with zipfile.ZipFile(wheels[0]) as archive:
                  if member not in archive.namelist():
                      problems.append(f"{wheels[0].name} is missing {member}")
          print("\n".join(problems) or "every catalogue wheel carries its archive")
          sys.exit(1 if problems else 0)
          PY

      - name: Install what was built and use it
        run: uv run --no-project python scripts/check_release.py

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: ${{ matrix.distribution }} to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    # One job per project, each minting its own short-lived token from its own
    # trusted publisher. A single upload of all nine would depend on how PyPI
    # scopes a minted token across projects; nine uploads do not depend on it
    # at all, and a failure names the project it belongs to.
    strategy:
      fail-fast: false
      matrix:
        distribution:
          - lefx_sdk
          - lefx_engine
          - lefx_interfaces
          - lefx_effect_creation
          - lefx_device_respeaker
          - lefx_device_simulated_respeaker
          - lefxset_core_set
          - lefxset_smartspeaker_set
          - led_ctrl_v3
    permissions:
      # What trusted publishing needs, and the only reason this job has any
      # permissions at all. No token, no password, nothing stored.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Keep only this project's files
        run: |
          mkdir -p upload
          mv dist/${{ matrix.distribution }}-*.whl upload/
          mv dist/${{ matrix.distribution }}-*.tar.gz upload/
          ls -l upload

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload/

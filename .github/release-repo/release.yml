# Runs in the RELEASE repository, marcosudau-vps/led-ctrl-v3.
#
# It is not under .github/workflows/ in the development repository, so it never
# runs there; scripts/sync_release_tree.py puts it in place when it materialises
# the release tree. It lives in the development repository so that it is
# reviewed alongside the code it publishes.
#
# A tag in the release repository is set by the sync workflow and by nothing
# else, which is what makes "tagged here" mean "checked over there".
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_PYTHON: "3.12"

jobs:
  build:
    name: Build every distribution
    runs-on: ubuntu-latest
    # Belt and braces. A fork of this repository that inherited the workflow
    # would otherwise try to publish to the real project names on the real
    # index, and the failure would be a confusing 403 rather than a skip.
    if: github.repository == 'marcosudau-vps/led-ctrl-v3'
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Read the version out of the tree
        id: version
        run: |
          version=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release tree is at $version"

      - name: The tag has to name the version in the tree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          if [ "$tag" != "${{ steps.version.outputs.version }}" ]; then
            echo "tag v$tag does not match tree version ${{ steps.version.outputs.version }}" >&2
            exit 1
          fi

      - name: Build
        run: uv build --all-packages --out-dir dist

      # Build what will be published, then install it and use it. That step
      # opens the runtime wheel and looks for both catalogue archives inside,
      # which is the question this tree most needs asked: it arrived by
      # machine, and a wheel with no catalogue in it installs perfectly.
      #
      # Deliberately not repeated inline here. It was, with its own list of
      # catalogue names, and that list is what went stale when the
      # distributions were renamed — the release stopped at a guard looking
      # for a package that no longer existed. One implementation, derived
      # from the tree rather than written down twice.
      - name: Install what was built and use it
        run: uv run --no-project python scripts/check_release.py

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: ${{ matrix.distribution }} to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Part of what a trusted publisher matches on, so this name is not
    # decoration: each project's publisher on PyPI names the environment "pypi",
    # and a job that ran without it would be refused.
    environment: pypi
    # One job per project, each minting its own short-lived token from its own
    # trusted publisher. A single upload of all three would depend on how PyPI
    # scopes a minted token across projects; three uploads do not depend on it
    # at all, and a failure names the project it belongs to.
    strategy:
      fail-fast: false
      # One at a time. Parallel uploads are parallel *new projects* the first
      # time a generation is released, and PyPI answers most of them with "429
      # Too many new projects created" — it did, when there were nine of them.
      # Serialised they are far enough apart to get through, and a release
      # takes a couple of minutes longer, which is not a cost.
      max-parallel: 1
      matrix:
        # Wheel-filename form, so the glob below is exact. A wheel is named
        # {name}-{version}-..., so ledctrl_v3-*.whl matches the runtime alone
        # and never ledctrl_v3_effect_creation-*.whl.
        distribution:
          - ledctrl_v3
          - ledctrl_v3_device_simulated_respeaker
          - ledctrl_v3_effect_creation
    permissions:
      # What trusted publishing needs, and the only reason this job has any
      # permissions at all. GitHub mints a short-lived OIDC token, PyPI checks
      # it against the publisher registered for that project, and hands back an
      # upload token good for minutes. Nothing is stored anywhere.
      #
      # For this to resolve, each of the three projects must carry a publisher
      # naming owner marcosudau-vps, repository led-ctrl-v3, workflow
      # release.yml and environment pypi. A project that does not exist yet
      # takes a *pending* publisher on the account that should own it; a
      # project that already exists takes one under its own publishing
      # settings, which only an owner of that project can add.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Keep only this project's files
        run: |
          mkdir -p upload
          mv dist/${{ matrix.distribution }}-*.whl upload/
          mv dist/${{ matrix.distribution }}-*.tar.gz upload/
          ls -l upload

      # No password and no token: with id-token: write and nothing given here,
      # the action does the OIDC exchange by itself. Adding a password would
      # silently switch that off again, and take PEP 740 attestations with it.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload/
          # Makes a half-finished release resumable. PyPI refuses a file it
          # already has, so without this, re-running after a partial failure
          # fails again on everything that did work — and the only way forward
          # would be a version nobody needed. With it, the run can simply be
          # repeated until all three are up. It cannot mask a mistake: the
          # version is new on every release, so there is nothing to skip.
          skip-existing: true

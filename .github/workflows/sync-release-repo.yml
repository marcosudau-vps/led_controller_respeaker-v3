# Mirror the release tree into marcosudau-vps/led-ctrl-v3 and tag it there.
#
# Runs on a tag, because a tag is the one thing scripts/release.py only creates
# after CI has gone green for that exact commit. Everything downstream of here
# — the mirror, the tag over there, the upload to PyPI — is therefore already
# behind a check, and there is no path that reaches PyPI without passing it.
#
# It can also be run by hand with no tag. That mirrors the tree without tagging,
# so the release repository's release.yml stays idle and nothing is published:
# the way to look at what a release would contain before committing to one.
name: Sync the release repository

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Leave empty for an untagged main sync; tagged syncs must use the existing tag as ref."
        required: false
        default: ""

concurrency:
  group: release-repository-sync
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  UV_PYTHON: "3.12"
  RELEASE_REPO: marcosudau-vps/led-ctrl-v3

jobs:
  sync:
    name: Materialise and push
    runs-on: ubuntu-latest
    if: github.repository == 'marcosudau-vps/led_controller_respeaker-v3'
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync the workspace
        run: uv sync

      # The archives are output here and sources over there, so they have to
      # exist before the tree is materialised. sync_release_tree.py refuses to
      # run without them rather than shipping empty catalogue wheels.
      - name: Build the effect catalogues
        run: uv run python scripts/build_effects.py

      - name: Work out which tag this is
        id: tag
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF}" != "${GITHUB_REF#refs/tags/}" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            if [ -n "$REQUESTED_TAG" ]; then
              echo "Select the existing tag as workflow ref for a tagged release." >&2
              exit 1
            fi
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the exact pre-tag CI assets before mirroring a release
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [ "$GITHUB_REF" != "refs/tags/$TAG" ]; then
            echo "For a tagged release, select the existing development tag as the workflow ref." >&2
            exit 1
          fi
          uv run python scripts/publish_github_release.py "$TAG" --verify-only

      - name: Check out the release repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.RELEASE_REPO }}
          path: release-repo
          ssh-key: ${{ secrets.RELEASE_REPO_DEPLOY_KEY }}
          fetch-depth: 0

      # --clean, because this is a mirror rather than a merge: a file removed
      # from the whitelist has to disappear over there, and a leftover would
      # otherwise be published forever.
      - name: Materialise the release tree
        run: uv run python scripts/sync_release_tree.py --target release-repo --clean

      - name: Commit and push
        id: mirror
        working-directory: release-repo
        run: |
          git config user.name "lefx release bot"
          git config user.email "noreply@github.com"
          git add -A
          if [ -n "$TAG" ] && git show-ref --verify --quiet "refs/tags/$TAG"; then
            # Rebuilding ZIP catalogues can change archive timestamps; bind
            # retries to the immutable source commit recorded in our tag.
            if ! git for-each-ref --format='%(contents)' "refs/tags/$TAG" | grep -Fx "Development commit: $SOURCE_COMMIT"; then
              echo "Existing release tag is not bound to the expected source commit; refusing to overwrite." >&2
              exit 1
            fi
            if ! git show "$TAG:pyproject.toml" | grep -Fx "version = \"${TAG#v}\""; then
              echo "Existing release tag has a different version." >&2
              exit 1
            fi
            echo "already_tagged=true" >> "$GITHUB_OUTPUT"
            echo "Release tag already exists for the expected source. No push needed."
            exit 0
          fi
          if git diff --cached --quiet; then
            echo "the release tree is unchanged"
          else
            git commit -m "release: sync from ${SOURCE_COMMIT}${TAG:+ ($TAG)}"
            git push origin HEAD:main
          fi
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.tag.outputs.source_commit }}

      # Last, and only with a tag. This is what starts release.yml over there,
      # so it must not happen before the tree it describes is pushed.
      - name: Tag the release commit over there
        if: steps.tag.outputs.tag != '' && steps.mirror.outputs.already_tagged != 'true'
        working-directory: release-repo
        run: |
          git tag -a "$TAG" -m "$TAG" -m "Development commit: $SOURCE_COMMIT"
          git push origin "$TAG"
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.tag.outputs.source_commit }}

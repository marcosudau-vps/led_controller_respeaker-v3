# What has to hold before a commit is allowed to be part of this repository —
# and, since scripts/release.py waits for this workflow on the exact commit it
# is about to tag, what has to hold before anything reaches PyPI. Nothing here
# pushes or publishes; that is sync-release-repo.yml, and it runs on a tag.
#
# The steps mirror the ways this workspace can break: the packages stop
# resolving against each other, a definition stops building, behaviour
# regresses, a package boundary is crossed, a V1 concept comes back, the
# distributions stop being buildable, or the release tree stops being
# materialisable. The last two are not covered by the tests: an editable
# workspace imports from the checkout, so a wheel that ships the wrong files
# passes every test and fails at installation.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Every distribution declares >=3.12,<3.13. One version, because the code
  # supports one; a matrix here would be testing a claim nothing makes.
  UV_PYTHON: "3.12"
  FORCE_COLOR: "1"
  # There is no display on a runner. Qt draws into a buffer instead, which is
  # enough for what the window tests ask: that a signal matches its slot, that a
  # paint does not throw, that an editor gives back what it was given.
  QT_QPA_PLATFORM: offscreen

jobs:
  check:
    name: Build, test and package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Qt's own shared libraries, which the PySide6 wheel does not carry. The
      # studio is a desktop application and depends on Qt outright, so a runner
      # that cannot load it cannot check the studio at all.
      - name: Install the Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libxcb-cursor0

      # 1. The workspace resolves and installs, members against members.
      #    Without the simulator's gui extra: a service machine does not have
      #    one, and the ring window's own tests skip themselves where Qt is
      #    absent. The studio brings Qt regardless — it *is* a window — which is
      #    why the libraries above are installed.
      - name: Sync the workspace
        run: uv sync

      # 2. Every definition validates, packs and loads back. The catalogue is
      #    built output rather than a committed artefact, so this is also what
      #    puts one where the later steps expect it.
      - name: Build the effect catalogue
        run: uv run python scripts/build_effects.py

      # 3. Everything that does not need a device. The runner has no reSpeaker,
      #    so the hardware suite is deselected by its marker; what needs a
      #    device and nothing else is the one thing a CI cannot answer.
      - name: Run the hardware-free test suite
        run: uv run pytest -q -m "not hardware"

      # 4. and 5. Both ran above as part of the suite. They are repeated here on
      #    their own because they are the two rules that do not protect a
      #    behaviour but a shape — when one of them fails, the failure should
      #    name itself in the job list rather than be one line inside a suite of
      #    a thousand.
      - name: Check the package boundaries
        run: uv run pytest -q tests/architecture/test_architecture.py

      - name: Check for returning V1 concepts
        run: uv run pytest -q tests/architecture/test_legacy.py

      # 6. Build all three distributions, install them into an empty environment
      #    and exercise what only an installation can show: entry points,
      #    console scripts, the catalogue wheels actually carrying a catalogue,
      #    INCLUDED_LEFXSET selecting on installed metadata, and the simulator's
      #    service half with no Qt present.
      - name: Build the distributions and smoke-test the artefacts
        run: uv run python scripts/check_release.py

      # 7. The release tree can be materialised and stands on its own. Checked
      #    here rather than discovered on a tag: the sync workflow is the one
      #    step of a release that has no way back, and finding out then that a
      #    file is missing from the whitelist means finding out after the tag.
      - name: Materialise the release tree and build it
        run: |
          uv run python scripts/sync_release_tree.py --target ../release-tree --clean
          cd ../release-tree
          uv build --all-packages --out-dir dist

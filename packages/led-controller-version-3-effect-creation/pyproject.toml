[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "led-controller-version-3-effect-creation"
version = "3.0.3"
description = "LEFX V3 effect creation: scaffolding, source validation, package building and the desktop studio"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
keywords = ["lefx", "led", "effects", "build", "packaging", "editor", "gui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
]

# Everything that makes an effect, and nothing that runs one. A default
# installation of led-controller-version-3 does not have this package and does not need it:
# it consumes finished .lefx and .lefxset files, which is the whole reason
# creation is a separate distribution.
#
# The dependencies are what creation actually needs: the schema to write
# against, the loader to verify what was just built, and the control surface the
# studio drives a device through.
#
# Not on either device package. The studio picks its output at runtime from the
# same entry points the service reads, so installing it does not decide which
# hardware you have.
#
# Qt is a hard dependency rather than an extra. The studio *is* a window, and a
# package that offers effect creation with the workbench left out would be a
# third thing to explain. What holds instead is a boundary inside the package:
# nothing under lefx/effect_creation/ imports Qt except lefx/effect_creation/studio/,
# so lefx-pack in a build pipeline never touches it.
dependencies = [
    # The runtime, which carries the schema to write against, the loader to
    # verify what was just built, and the control surface the studio drives a
    # device through. One name now, because those four layers ship together.
    "led-controller-version-3==3.0.3",
    "PySide6>=6.0.0",
    # Imported directly to read and write a source tree. It arrives with the
    # runtime anyway, but a package that imports a thing declares it.
    "PyYAML>=6.0.2,<7",
]

[project.scripts]
lefx-pack = "lefx.effect_creation.cli:main"
lefx-studio = "lefx.effect_creation.studio.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lefx"]

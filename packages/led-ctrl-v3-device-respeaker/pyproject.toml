[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "led-ctrl-v3-device-respeaker"
version = "3.0.0"
description = "reSpeaker XVF3800 hardware integration: USB transport, LED frame sink and DoA input provider"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
keywords = ["respeaker", "xvf3800", "usb", "led", "doa"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Hardware :: Hardware Drivers",
]

# Depends on the SDK ports only. The engine is never imported here: the engine
# consumes this package through entry points, not the other way round.
dependencies = [
    "led-ctrl-v3-sdk==3.0.0",
    "libusb-package>=1.0.26.3,<1.1",
    "pyusb>=1.3.1,<2",
]

# Inspecting the device, and taking it back from another process that holds it.
# A separate command rather than only a service flag: force-claiming stops
# somebody's program, and that should be visible before it is triggered.
[project.scripts]
lefx-respeaker = "lefx.device.respeaker.cli:main"

# Output and input are registered separately so that a failing DoA read cannot
# take the LED output with it, and vice versa.
#
# A provider is named "<device>.<capability>". The device half keeps it distinct
# from the simulator's when both packages are installed; the capability half is
# the only part an effect names, so the same definition runs against either.
[project.entry-points."lefx.frame_sinks"]
respeaker = "lefx.device.respeaker.registration:create_frame_sink"

[project.entry-points."lefx.input_providers"]
"respeaker.doa" = "lefx.device.respeaker.registration:create_doa_provider"

[tool.hatch.build.targets.wheel]
packages = ["src/lefx"]

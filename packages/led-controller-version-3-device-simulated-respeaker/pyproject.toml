[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "led-controller-version-3-device-simulated-respeaker"
version = "3.0.2"
description = "Software device double for the LED ring: frame sink, simulated DoA input and a visual ring window"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
keywords = ["respeaker", "led", "simulator", "preview"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

# The service-side half — sink, provider and transport client — carries no GUI
# dependency. Only the person who opens the ring window needs Qt, so PySide6 is
# an extra rather than a hard requirement.
dependencies = [
    # Only for the ports in lefx.sdk. That the schema now ships inside the
    # runtime distribution does not license reaching into the rest of it: the
    # architecture test holds this package to lefx.sdk and nothing else, which
    # is what keeps it swappable with the hardware.
    "led-controller-version-3==3.0.2",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.0.0",
]

[project.scripts]
lefx-simulator = "lefx.device.simulated_respeaker.app:main"

# A provider is named "<device>.<capability>". Registering the capability alone
# would collide with the hardware's the moment both packages are installed;
# naming the device keeps them apart while an effect still asks only for "doa".
[project.entry-points."lefx.frame_sinks"]
simulator = "lefx.device.simulated_respeaker.registration:create_frame_sink"

[project.entry-points."lefx.input_providers"]
"simulator.doa" = "lefx.device.simulated_respeaker.registration:create_doa_provider"

[tool.hatch.build.targets.wheel]
packages = ["src/lefx"]

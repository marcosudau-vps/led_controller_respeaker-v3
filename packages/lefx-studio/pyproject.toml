[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "lefx-studio"
version = "3.0.0"
description = "LEFX V3 studio: a desktop workbench for playing, tuning, calibrating and authoring effects"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
keywords = ["lefx", "led", "effects", "editor", "gui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
]

# An application, so it sits on top of everything: the schema to build widgets
# from, the engine to render with, the control surface to drive a device
# through, and the authoring tools to write a source back out.
#
# Not on either device package. The output is chosen at runtime from the same
# entry points the service reads, so installing the studio does not decide
# which hardware you have.
#
# Qt is a hard dependency here rather than an extra. This *is* the window; a
# studio without one would not be anything.
dependencies = [
    "lefx-sdk==3.0.0",
    "lefx-engine==3.0.0",
    "lefx-authoring==3.0.0",
    "lefx-interfaces==3.0.0",
    "PySide6>=6.0.0",
    # Imported directly to write a preset back into a source tree. It arrives
    # through lefx-authoring anyway, but a package that imports a thing declares it.
    "PyYAML>=6.0.2,<7",
]

[project.scripts]
lefx-studio = "lefx.studio.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lefx"]

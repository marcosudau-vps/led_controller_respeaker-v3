[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lefx_configurator_widget"
version = "3.0.4"
description = "Embeddable Qt effect and feedback mapping configurator for LEFX V3"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["led-controller-version-3==3.0.4", "PySide6-Essentials>=6.8,<7"]

[project.gui-scripts]
lefx-configurator-widget = "lefx.configurator_widget.testlab:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lefx"]

[tool.hatch.build.targets.sdist]
include = ["src/lefx", "docs", "examples", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

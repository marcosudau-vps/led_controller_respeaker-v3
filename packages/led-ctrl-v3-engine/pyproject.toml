[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "led-ctrl-v3-engine"
version = "3.0.0"
description = "LEFX V3 runtime: layers, composition, lifecycles, registry and package loading"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
keywords = ["lefx", "led", "effects", "engine"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

# The engine knows the SDK and nothing else. No HTTP, no CLI, no USB, no Qt.
dependencies = [
    "led-ctrl-v3-sdk==3.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lefx"]

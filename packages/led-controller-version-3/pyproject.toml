[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "led-controller-version-3"
version = "3.0.3"
description = "LED ring control for the reSpeaker XVF3800 — the LEFX V3 effect system"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
keywords = ["respeaker", "xvf3800", "led", "effects", "lefx", "usb", "doa"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Hardware :: Hardware Drivers",
]

# Everything needed to play finished effects on a reSpeaker, and nothing that
# makes one. Four module layers and both catalogues, in one distribution
# because nothing ever installs a subset of them: no extra selects between the
# schema, the engine, the control surface and the hardware, so splitting them
# across four PyPI projects would be bookkeeping from the source tree leaking
# into the index.
#
# The layers are still layers. lefx.engine may not reach lefx.interfaces and
# neither may reach a device; that rule now lives in the architecture test over
# directories rather than in four dependency lists, and it is the same rule.
dependencies = [
    # The control surface.
    "fastapi>=0.135.3,<0.136",
    "pydantic>=2.12.5,<2.13",
    "uvicorn>=0.44.0,<0.45",
    # config.yaml.
    "PyYAML>=6.0.2,<7",
    # The reSpeaker over USB.
    "libusb-package>=1.0.26.3,<1.1",
    "pyusb>=1.3.1,<2",
    "tzdata>=2025.2; platform_system == 'Windows'",
]

# Each of these is a distribution of its own, not a switch. What is not
# installed is not in the running system: devices arrive through entry points
# and are never imported, so uninstalling one removes it with no list to edit.
#
# The catalogues are deliberately not here. They ship with this package and are
# selected at runtime by included_lefxset, because choosing which effects to
# load is a configuration question, not an installation question.
[project.optional-dependencies]
simulated-respeaker = ["led-controller-version-3-device-simulated-respeaker[gui]==3.0.3"]
effect-creation = ["led-controller-version-3-effect-creation==3.0.3"]
all = [
    "led-controller-version-3-device-simulated-respeaker[gui]==3.0.3",
    "led-controller-version-3-effect-creation==3.0.3",
]

[project.scripts]
lefx = "lefx.interfaces.cli:main"
# Inspecting the device, and taking it back from another process that holds it.
# A separate command rather than only a service flag: force-claiming stops
# somebody's program, and that should be visible before it is triggered.
lefx-respeaker = "lefx.device.respeaker.cli:main"

# Output and input are registered separately so that a failing DoA read cannot
# take the LED output with it, and vice versa.
#
# A provider is named "<device>.<capability>". The device half keeps it distinct
# from the simulator's when both are installed; the capability half is the only
# part an effect names, so the same definition runs against either.
[project.entry-points."lefx.frame_sinks"]
respeaker = "lefx.device.respeaker.registration:create_frame_sink"

[project.entry-points."lefx.input_providers"]
"respeaker.doa" = "lefx.device.respeaker.registration:create_doa_provider"

# The catalogues, found the same way a device is. They happen to ship in this
# same distribution, but the service does not know that: it reads the group and
# uses what is registered, which is what leaves room for a set from anywhere.
[project.entry-points."lefx.effect_sets"]
core-set = "lefx.sets.core_set:package_file"
smartspeaker-set = "lefx.sets.smartspeaker_set:package_file"

[tool.hatch.build.targets.wheel]
packages = ["src/lefx"]

# The archives are built output, so they are gitignored, and hatchling excludes
# ignored files by default — a wheel with the modules in it and no catalogue.
# "artifacts" is the exception list for exactly that case: include them if they
# are there. Deliberately not force-include, which fails the build when they
# are absent and would make a fresh checkout unsyncable, since the tool that
# builds them is itself part of this workspace.
#
# That leaves one hole — a wheel built before the sets were — and it is closed
# where it belongs, in scripts/check_release.py, which opens the built wheel
# and looks for the archives inside.
[tool.hatch.build]
artifacts = ["src/lefx/sets/*/*.lefxset"]

[tool.hatch.build.targets.sdist]
include = ["src/lefx", "README.md"]

[project.urls]
Homepage = "https://github.com/marcosudau-vps/led_controller_respeaker-v3"
Source = "https://github.com/marcosudau-vps/led_controller_respeaker-v3"

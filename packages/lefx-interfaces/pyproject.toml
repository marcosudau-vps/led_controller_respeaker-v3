[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "lefx-interfaces"
version = "3.0.0"
description = "LEFX V3 control surface: HTTP API, CLI, client and service hosting"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
keywords = ["lefx", "led", "effects", "api", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

# Frame sinks and input providers are discovered through entry points, never
# imported. That is why no hardware or simulator package appears here.
dependencies = [
    "lefx-sdk==3.0.0",
    "lefx-engine==3.0.0",
    "fastapi>=0.135.3,<0.136",
    "pydantic>=2.12.5,<2.13",
    "uvicorn>=0.44.0,<0.45",
    "tzdata>=2025.2; platform_system == 'Windows'",
]

[project.scripts]
lefx = "lefx.interfaces.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lefx"]
